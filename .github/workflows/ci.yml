name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "archived/**"
      - "resources/**"
      - "**.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "archived/**"
      - "resources/**"
      - "**.md"

# cancel an in-progress run when a newer commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
